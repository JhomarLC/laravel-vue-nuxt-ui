# Merged automatically with docker-compose.yml (Laravel Sail).
# If you use MySQL/MariaDB instead of PostgreSQL, change `depends_on` to `mysql` or `mariadb`.
services:
    adminer:
        image: adminer:latest
        ports:
            - '${FORWARD_ADMINER_PORT:-8080}:8080'
        networks:
            - sail
        depends_on:
            - pgsql
